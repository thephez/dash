name: Build container

on:
  workflow_call:
    inputs:
      context:
        description: "Path to use for build context"
        required: true
        type: string
      file:
        description: "Path to Dockerfile"
        required: true
        type: string
      name:
        description: "Container name"
        required: true
        type: string
      runs-on-amd64:
        description: "Runner label to use for amd64 jobs"
        required: true
        type: string
      runs-on-arm64:
        description: "Runner label to use for arm64 jobs"
        required: true
        type: string
    outputs:
      path:
        description: "Digest reference to the container built by this run"
        value: ${{ jobs.create-manifest.outputs.path }}

jobs:
  build-amd64:
    name: Build container (amd64)
    runs-on: ${{ inputs.runs-on-amd64 }}
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      repo: ${{ steps.prepare.outputs.repo }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Prepare variables
        id: prepare
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          platforms: linux/amd64
          # Only trusted events may write tags that other runs read
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo }}/${{ inputs.name }}:${{ github.event_name == 'push' && format('trusted-{0}', hashFiles(inputs.file)) || 'untrusted' }}-amd64
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo }}/${{ inputs.name }}:trusted-${{ hashFiles(inputs.file) }}-amd64
          cache-to: type=inline

  build-arm64:
    name: Build container (arm64)
    runs-on: ${{ inputs.runs-on-arm64 }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Prepare variables
        id: prepare
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          platforms: linux/arm64
          # Only trusted events may write tags that other runs read
          tags: |
            ghcr.io/${{ steps.prepare.outputs.repo }}/${{ inputs.name }}:${{ github.event_name == 'push' && format('trusted-{0}', hashFiles(inputs.file)) || 'untrusted' }}-arm64
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repo }}/${{ inputs.name }}:trusted-${{ hashFiles(inputs.file) }}-arm64
          cache-to: type=inline

  create-manifest:
    name: Create multi-arch manifest
    runs-on: ${{ inputs.runs-on-arm64 }}
    needs: [build-amd64, build-arm64]
    outputs:
      path: ${{ steps.manifest.outputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          TRUSTED: ${{ github.event_name == 'push' }}
        run: |
          REPO="ghcr.io/${{ needs.build-amd64.outputs.repo }}/${{ inputs.name }}"
          TAG="${{ needs.build-amd64.outputs.tag }}"
          HASH_TAG="${{ hashFiles(inputs.file) }}"

          if [[ "$TRUSTED" == "true" ]]; then
            TAGS=(-t "${REPO}:${HASH_TAG}" -t "${REPO}:${TAG}" -t "${REPO}:latest")
          else
            TAGS=(-t "${REPO}:untrusted")
          fi

          # Use this run's digests: tags can be moved by concurrent runs
          docker buildx imagetools create --metadata-file "${RUNNER_TEMP}/manifest.json" "${TAGS[@]}" \
            "${REPO}@${{ needs.build-amd64.outputs.digest }}" \
            "${REPO}@${{ needs.build-arm64.outputs.digest }}"

          DIGEST=$(jq -er '."containerimage.descriptor".digest' "${RUNNER_TEMP}/manifest.json")
          echo "path=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
